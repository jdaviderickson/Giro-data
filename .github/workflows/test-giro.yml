name: Update GIRO data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: giro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest GIRO data
        run: python fetch_giro.py

      - name: Commit JSON if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pa836_latest.json
          if git diff --cached --quiet; then
            echo 'No data change.'
            exit 0
          fi
          git commit -m 'Update PA836 GIRO data'
          git push
